# =============================================================================
# GitHub Actions 工作流：编译 K2P 的 Padavan 固件（**最终版：用户 2026-10-15 决定**）
# -----------------------------------------------------------------------------
# 依据：doc/D12 §16（编译规划 v2）· doc/D13 §1.7/§8（功能取舍与决策）· 第 103/106/107 轮
# 由 hanwckf/padavan-4.4 自带的 .github/workflows/CI.yml 改造而来
#   改动：① runs-on 20.04→22.04（20.04 已被 GitHub 弃用，不改必失败）
#         ② 单 target（第 109 轮 = K2P-final2；★ 2026-10-16 已把默认值从 K2P-final 改过来）③ 增加 toolchain 缓存
#         ④ 增加"确认 9 项用户决定是否生效"步骤
#         ⑤ 增加"产物自检"（u-boot legacy image 头 + 双 CRC + squashfs + 尺寸）
#         ⑥ WDT 补丁默认 **no**（★ 喂狗可用【零编译脚本】实现，不必改固件）
#
# ★ 版本变更日志：
#   v1  2026-10-15 17:25  初版（9 步流程定稿）
#   v2  2026-10-15 18:30  **修正 "Verify built image" 的两处缺陷**：
#                         ① v1 按 Broadcom trx 头布局解析（b[4:8]=len / b[8:12]=crc），
#                            但 Padavan 产出的 .trx 是 u-boot legacy image ⇒ 对【正确镜像】
#                            也打印 "data crc BAD" + "TOO BIG(3.9GB)"（假警报）；
#                         ② v1 没有失败路径（仅"无 .trx"时才 raise）⇒ 对【真损坏的镜像】
#                            仍 rc=0 静默放行（零执行力度，与步骤名承诺不符）。
#                         现改为按 0x04 hcrc / 0x08 itime / 0x0C ih_size / 0x10 ih_load /
#                         0x14 ih_ep / 0x18 dcrc 解析，补齐 squashfs 魔数 + load 地址判据，
#                         并对齐 04_工具脚本/r102_trx_verify.py；不通过则 ::error:: + 非零退出。
#                         元验证：good/corrupt_data/bad_magic/padded_mtd3 四组对照全符合预期。
#                         证据：对 02_配置备份/回退镜像_20261015/K2P_4.4.3.9_recovered.trx 实测。
#                         旧版留存 build-k2p.yml.bak_20261015_1828
#
#   v3  2026-10-25（第 182 轮）两处加固，均为第 181/182 轮对抗复核的直接产物：
#       ① **R-04 基线钉死**：`actions/checkout@v4` 加 `ref: 955cf611498fda5fa6ece2c7197f4234573b47e6`。
#          原先无 ref ⇒ 取「运行时 fork 的 main HEAD」⇒ 上游任何新提交都会静默改变基线，
#          使 20 个补丁与 49 处断言整体失效；这与预飞检查报告「钉 SHA 取件」自相矛盾。
#       ② **R-13 工具链校验**：`Prepare toolchain` 增加 md5/sha256 钉死校验
#          （`d0d96e64acf0ff115dca6ef678ce3f99` / `928db92fb2dd2d9f7cc540a40cbadaa2224b582e7b186f46c743d458ad768dc6`，
#           第 180 轮实测值）。release 无官方 digest，且 `dl_toolchain.sh` 的 `curl -O -L` 不校验
#          ⇒ 原本「换 tag 静默换 libc」这条 P1 风险在流水线上零拦截点。
#       备份：`_维护记录/_第182轮_补丁修复前备份/build-k2p.yml`
#
# ★ 需要你上传【两个文件】到自己 fork 的仓库：
#   1) .github/workflows/build-k2p.yml            ← 本文件
#   2) configs/K2P-final2.config                  ← 05_固件构建/K2P-final2.config
#      （或放到 trunk/configs/templates/K2P-final2.config；两者任一即可，脚本会自动找/复制）
#   3) patches/0003 ~ 0050（**43 个补丁**，缺任一个都会在 §Apply v109 patches 步被 ::error:: 拦下）
#      上传用脚本：04_工具脚本/r109h_gh_cloud_build.py（UPLOADS 已列全 46 条；第 208 轮加 0047/0048，第 210 轮加 0049/0050）
#   （若 with_wdt_patch=yes，还需 patches/0001-rc-watchdog-feed-hw-wdt.patch）
#
# 触发：仓库页 → Actions → 左侧 "Build K2P Padavan (final)" → Run workflow
# 产出：运行页底部 Artifacts → K2P-padavan-images（7z，含 .trx + md5sum.txt）
# =============================================================================
name: Build K2P Padavan (final)

on:
  workflow_dispatch:
    inputs:
      target:
        description: '编译目标（configs/templates/<名字>.config）'
        required: false
        default: 'K2P-final2'
      with_wdt_patch:
        description: '打 WDT 喂狗补丁 0001？（yes / no）—— ★ 2026-10-26 用户拍板：默认 yes'
        required: false
        default: 'yes'
      # ★ 2026-10-16 新增：让"回退路径"真正可执行（原版把 happy path 硬写成断言 ⇒ R1/R2/R3 全被 exit 1 拦下）
      strict_assert:
        description: '断言是否致命（yes / no）—— 设 no：语义断言降级为 warning（改 config 重跑时用）'
        required: false
        default: 'yes'
      apply_v109_patches:
        description: '是否真正应用 0003–0006 裁剪补丁（yes / no）—— 设 no：只做 dry-run 校验，不改源码树（回退到旧配置时用）'
        required: false
        default: 'yes'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: build-${{ github.event.inputs.target || 'K2P-final2' }}
    runs-on: ubuntu-22.04
    env:
      IMAGES_DIR: /opt/images
      TARGET: ${{ github.event.inputs.target || 'K2P-final2' }}
      STRICT_ASSERT: ${{ github.event.inputs.strict_assert || 'yes' }}
      APPLY_V109_PATCHES: ${{ github.event.inputs.apply_v109_patches || 'yes' }}
    steps:
      # ---- 基线钉死（R-04 fix, 第 182 轮）----
      #   背景：原先只用 actions/checkout@v4（无 ref），取的是「运行时 fork 的 main HEAD」。
      #   上游任何新提交都会静默改变基线，使 20 个补丁与 49 处断言整体失效；
      #   而 05_固件构建/github-actions/预飞检查报告_20261015.md:7 声称「钉 SHA 取件，非浮动
      #   HEAD」、doc/D12 要求「必须钉住」⇒ 原状态与归档自相矛盾。
      #   955cf611498fda5fa6ece2c7197f4234573b47e6 = 现行固件（wfb835/padavan-4.4 main）构建提交。
      #   ★ 若要升级基线：改下面 sha，并同步 05_固件构建/K2P-final2.config 的版本说明与
      #     04_工具脚本/r109h_gh_cloud_build.py 的期望 md5。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 955cf611498fda5fa6ece2c7197f4234573b47e6
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            libtool-bin gperf python3-docutils autopoint gettext \
            build-essential fakeroot p7zip-full patch curl

      # ---- 把我们的定制配置放进 templates（两种上传位置都支持）----
      - name: Place custom config
        run: |
          set -e
          A="trunk/configs/templates/${TARGET}.config"
          B="configs/${TARGET}.config"
          if [ -f "$A" ]; then
            echo "OK already exists: $A"
          elif [ -f "$B" ]; then
            echo "copy $B -> $A"
            cp -f "$B" "$A"
          else
            echo "::error::config not found: upload configs/${TARGET}.config or trunk/configs/templates/${TARGET}.config"
            exit 1
          fi

      # ---- 打印"9 项用户决定"是否真的生效（防止编错/刷错）----
      - name: Verify decisions in config
        run: |
          set -e
          F="trunk/configs/templates/${TARGET}.config"
          # strict_assert=no ⇒ 断言降级为 warning（改 config 重跑 / 回退时用，见交接单 §7）
          FAILED=0
          # ★ 累积式断言：一次列全所有不符项（不 fail-fast），末尾统一退出
          fail() { if [ "$STRICT_ASSERT" = "no" ]; then echo "::warning::$*"; else echo "::error::$*"; FAILED=1; fi; }
          must() { # must <期望后缀> <键名...>
            want="$1"; shift
            for k in "$@"; do
              v=$(grep -m1 "^CONFIG_FIRMWARE_INCLUDE_${k}=" "$F" || echo "(missing)")
              case "$v" in *"=$want") echo "  OK   $v" ;; *) fail "expect =$want but got: $v" ;; esac
            done
          }
          echo "===== [第108轮] 用户决定：5 x n + 4 x y（★ 原版只打印不断言，现已改为断言）====="
          must n DOGCOM MINIEAP NJIT_CLIENT SRELAY EAP_PEAP
          must y SMARTDNS QOS IMQ IFB
          echo "===== [第109轮] 必须存在且正确的 4 项 ====="
          must n OPENVPN XUPNPD
          must y LRZSZ FRPC
          echo "===== [第109轮] 用户明确保留（勿被裁掉）—— NANO / HTOP 必须 =y ====="
          must y NANO HTOP
          echo "===== [用户 6 条硬约束之④]「TCPDUMP/TTYD/IPERF3 需要有」必须 =y（★ 新增）====="
          must y TCPDUMP TTYD IPERF3
          echo "===== 其余保留项（防误裁；★ 新增）====="
          must y OPENSSH SFTP OPENSSL_EXE CURL VLMCSD WIREGUARD IPSET LANG_CN SFE
          echo "===== coremark (no switch; from user/Makefile dir_y) ====="
          grep -n "dir_y.*coremark" trunk/user/Makefile || fail "coremark 行缺失 - 基线不是 hanwckf？（应为 trunk/user/Makefile 的 dir_y += coremark）"
          echo "===== ★★ 硬需求（【不受 strict_assert 降级影响】）：FRPC 必须 =y / FRPS 必须 =n ====="
          # 依据：用户 2026-10-16 明确「新固件必须包含 frpc，以后要用，还得能代理别的端口」。
          # ⇒ FRPC **禁止**被当作"体积超限"的回退手段（替代回退序列见 编译交接单 §7）。
          # ⇒ 因此这里不走 fail()（会被 strict_assert=no 降级成 warning），而是**直接 exit 1**。
          FRPCLINE=$(grep -m1 '^CONFIG_FIRMWARE_INCLUDE_FRPC=' "$F" || echo '(missing)')
          case "$FRPCLINE" in
            *=y) echo "  OK   $FRPCLINE（硬需求满足）" ;;
            *) echo "::error::FRPC 是硬需求（用户要求「新固件必须包含 frpc」），当前 = $FRPCLINE；不可关闭，也不可作为体积回退手段（改用交接单 §7 的替代序列）"; exit 1 ;;
          esac
          # FRPS=n 是【体积闸门】，不是功能取舍：上游 trunk/user/frp/Makefile 的 romfs: 段
          #   只在 CONFIG_FIRMWARE_INCLUDE_FRPS=y 时额外装 /usr/bin/frps（21,233,857 B）。
          #   实测（128 KiB 分块 xz preset6，参数源自 squashfs-tools xz_wrapper.c 的
          #   lzma_lzma_preset(LZMA_PRESET_DEFAULT) + dict_size=block_size）：frps 压缩后 5,362,956 B
          #   ⇒ 若误开 FRPS=y，预计镜像 ≈ 18,738,035 B，**超出 mtd3 上限 2,812,787 B**，
          #     必被第 13 步 'Verify built image' 拦下。与其到第 13 步才炸，不如在这里说清。
          #   AP 上只需要 frpc（客户端）；frps 跑在 VPS 上，与固件无关。
          FRPSLINE=$(grep -m1 '^CONFIG_FIRMWARE_INCLUDE_FRPS=' "$F" || echo '(missing)')
          case "$FRPSLINE" in
            *=n) echo "  OK   $FRPSLINE（体积闸门：不把 frps 塞进固件）" ;;
            *) echo "::error::FRPS 必须 =n：frps（21,233,857 B → xz 后 5,362,956 B）会把镜像撑到 ≈18,738,035 B，超出 mtd3 上限 15,925,248 B 达 2,812,787 B；AP 只需 frpc，frps 应在 VPS 上运行。当前 = $FRPSLINE"; exit 1 ;;
          esac
          [ "$FAILED" = "0" ] || { echo "::error::config 断言未全部通过（见上文 ::error:: 行）"; exit 1; }

      - name: Show expected version string
        run: |
          echo "version string comes from versions.inc (git short hash):"
          echo "  $(git rev-parse --short=7 HEAD)"
          echo "(current firmware is 4.4.3.9-100_6acfc2c; this build should be 4.4.3.9-100_<hash above>)"

      # ---- WDT 喂狗补丁（默认关）----
      - name: Apply WDT patch
        if: ${{ github.event.inputs.with_wdt_patch == 'yes' }}
        run: |
          set -e
          P="patches/0001-rc-watchdog-feed-hw-wdt.patch"
          if [ ! -f "$P" ]; then
            echo "::error::patch not found: upload $P, or set with_wdt_patch=no"
            exit 1
          fi
          echo "== dry run =="
          patch -p1 --dry-run < "$P"
          echo "== apply =="
          patch -p1 < "$P"
          # ★ 2026-10-26：原写法 `grep -n ... | head` 的退出码来自 head，恒 0 ⇒ 断言形同虚设
          if ! grep -q "hw_wdt_feed" trunk/user/rc/watchdog.c; then
            echo "::error::0001 未生效：watchdog.c 缺 hw_wdt_feed"
            exit 1
          fi
          if ! grep -q '/dev/watchdog' trunk/user/rc/watchdog.c; then
            echo "::error::0001 未生效：watchdog.c 未 open /dev/watchdog"
            exit 1
          fi
          echo "  OK   0001 已生效（hw_wdt_feed + /dev/watchdog）"
          grep -n "hw_wdt_feed" trunk/user/rc/watchdog.c | head

      # ---- ★ 第 109 轮：裁剪补丁 + frp 版本对齐（默认应用；含 0003——它此前从未被应用）----
      #  0003 miniupnpd portinuse/leasefile 修复（第103轮移植成果，此前一直被漏掉）
      #  0004 删 Makefile 5 项：infosvr / udpxy / lanauth / 802.1x / xl2tpd
      #  0005 frp/Makefile：FRP_VER 0.29.0 → 0.71.1（与 VPS 上 frps 对齐）
      #  0006 删 Makefile 1 项：poptop（PPTP 服务端）
      #  0007 删 Web 页内 infosvr 开关（www/n56u_ribbon_fixed/Advanced_Services_Content.asp）—— 第 110 轮「去无效入口」
      #  0008 删 VPN 三页 + VPN 下拉项（★ 真路径 www/n56u_ribbon_fixed/device-map/internet.asp，非 www 根）
      #       + www/Makefile 加删除行 —— 第 110 轮「去无效入口」
      # ★ 2026-10-16：apply_v109_patches=no ⇒ 只 dry-run 校验、不改源码树（回退到旧配置时用）
      - name: Apply patches 0003 ~ 0050 (trim + frp + ttyd + M9 + libs + openssl + P1 + auth + WNM/raeth/staticmac + TX timeout + Andes seq0 + UI mem + multi-client login)
        run: |
          set -e
          FAILED=0
          # ★ 累积式断言：一次列全所有不符项（不 fail-fast），末尾统一退出
          fail() { if [ "$STRICT_ASSERT" = "no" ]; then echo "::warning::$*"; else echo "::error::$*"; FAILED=1; fi; }
          for P in patches/0003-miniupnpd-portinuse-leasefile.patch \
                   patches/0004-user-Makefile-drop-infosvr-lanauth-8021x.patch \
                   patches/0005-frp-Makefile-bump-FRP_VER-to-0.71.1.patch \
                   patches/0006-user-Makefile-drop-poptop.patch \
                   patches/0007-www-drop-infosvr-toggle.patch \
                   patches/0008-www-drop-vpn-pages.patch \
                   patches/0009-ttyd-bump-1.7.7-with-W.patch \
                   patches/0010-igmp-snoop-bounds-fix.patch \
                   patches/0011-libz-bump-1.2.13.patch \
                   patches/0012-libpcap-bump-1.10.7.patch \
                   patches/0013-libuv-bump-1.53.0.patch \
                   patches/0014-libjson-c-bump-0.18.patch \
                   patches/0015-openssl-1.1.1w.patch \
                   patches/0016-curl-7.88.1.patch \
                   patches/0017-ncurses-6.5.patch \
                   patches/0018-defaults-lan_proto_x-0.patch \
                   patches/0019-mlme-auth-frame-length.patch \
                   patches/0020-libwebsockets-4.5.8.patch \
                   patches/0021-raeth-rx-length-guard.patch \
                   patches/0022-vlmcsd-rpcbind-int-overflow.patch \
                   patches/0023-cmm_sanity-ch-switch-wrapper-bounds.patch \
                   patches/0024-cmm_sanity-wsc-ie-append-bounds.patch \
                   patches/0025-bss_ops-varie-length-bound.patch \
                   patches/0026-cmm_wpa-eapol-keydata-bound.patch \
                   patches/0027-cmm_wpa-gtklen-upper-bound.patch \
                   patches/0028-wnm-btm-query-minlen.patch \
                   patches/0029-wnm-btm-event-buflen-width.patch \
                   patches/0030-web-sys-script-whitelist.patch \
                   patches/0031-web-ej-dump-path-traversal.patch \
                   patches/0032-web-httpd-auth-state-gate.patch \
                   patches/0033-wnm-action-minlen-all-handlers.patch \
                   patches/0034-raeth-ioctl-require-cap-net-admin.patch \
                   patches/0035-rc-dhcp-staticmac-hex.patch \
                   patches/0036-mt7615-ioctl-require-cap-net-admin.patch \
                   patches/0042-raeth-pdma-page-lock-irqsave.patch \
                   patches/0043-raeth-esw-irq-free-dev-id.patch \
                   patches/0044-rc-k2p-syslog-buffer-1mb.patch \
                   patches/0045-andes-seq-retry-cap.patch \
                   patches/0046-raeth-virtualif-ioctl-copy-check.patch \
                   patches/0047-raeth-pdma-tx-done-timeout.patch \
                   patches/0048-andes-seq0-timeout-no-assert.patch \
                   patches/0049-web-ui-mem-available.patch \
                   patches/0050-httpd-multi-client-login.patch ; do
            if [ ! -f "$P" ]; then echo "::error::patch not found: $P"; exit 1; fi
            echo "================ $P ================"
            patch -p1 --dry-run < "$P"
            if [ "$APPLY_V109_PATCHES" = "no" ]; then
              echo "  (apply_v109_patches=no ⇒ 只 dry-run，不改源码树)"
            else
              patch -p1 < "$P"
            fi
          done
          if [ "$APPLY_V109_PATCHES" = "no" ]; then
            echo "===== 未应用补丁 ⇒ 跳过「6 项应全部消失」断言 ====="
          else
            echo "===== verify: 7 项 P1 修补特征应全部出现（第 186 轮新增）====="
          check_grep() {   # check_grep <文件> <特征正则> <标签>
            if grep -q "$2" "$1" ; then echo "  OK   $3" ; else fail "$3 -> 特征未出现（$1）" ; fi
          }
          M=trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt7615/embedded
          check_grep "$M/common/cmm_sanity.c" "UINT8 ch_sw_wrp_len"                        "F84-2 长度类型已改 UINT8"
          check_grep "$M/common/cmm_sanity.c" "WSC IE append skipped"                      "F84-3 追加前有上界判断"
          check_grep "$M/mgmt/bss_ops.c"      "LengthVIE <= MAX_VIE_LEN"                   "F87-1 VarIE 长度已钳制"
          check_grep "$M/security/cmm_wpa.c"  "MAX_LEN_OF_RSNIE)"                          "F77-1 KeyData 长度已钳制"
          check_grep "$M/security/cmm_wpa.c"  "GTKLEN > sizeof(GTK)"                       "F79-1 GTK 上界已加"
          check_grep "$M/common/wnm.c"        "BTM Query frame too short"                  "F110-1 BTM 帧长下限已加"
          check_grep "$M/common/wnm.c"        "BTM Rsp frame too short"                    "R-194-2 BTM Rsp 帧长下限已加"
          check_grep "$M/common/wnm.c"        "WNM Notify Req too short"                   "R-194-1 WNM Notify Req 帧长下限已加"
          check_grep "$M/common/wnm.c"        "WNM Notify Rsp too short"                   "R-194-3 WNM Notify Rsp 帧长下限已加"
          check_grep "$M/common/cmm_sanity.c" "subelement + 2, len_subelement"              "R-194-5 wb_info 源偏移已跳过子元素头"
          check_grep "trunk/user/httpd/httpd.c" "handler->need_auth && !do_logout"          "R-194-6 need_auth 不再对 localhost 免认证"
          check_grep "trunk/linux-4.4.x/drivers/net/ethernet/raeth/raether.c" "capable(CAP_NET_ADMIN)" "R-194-4 ei_ioctl 已要求 CAP_NET_ADMIN"
          check_grep "trunk/user/rc/services_ex.c" "strspn(smac," "R-194-7 dhcp_staticmac 已校验十六进制"
          check_grep "$M/common/wnm.c"        "UINT32 buflen"                              "F117-1 buflen 已改 32 位"
          echo "===== verify: 第 205 轮稳定性补丁（0036/0042/0043）====="
          check_grep "trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt7615/os/linux/ap_ioctl.c" "cmd <= SIOCIWLASTPRIV" "0036 mt7615 私有 ioctl 已加范围权限门"
          check_grep "trunk/linux-4.4.x/drivers/net/ethernet/raeth/raether_pdma.c" "spin_lock_irqsave(&ei_local->page_lock, flags)" "R-200-2 xmit 已改 irqsave"
          if grep -q "spin_lock(&ei_local->page_lock)" trunk/linux-4.4.x/drivers/net/ethernet/raeth/raether_pdma.c ; then
            fail "R-200-2 仍存在裸 spin_lock(page_lock)"
          else
