            echo "===== verify: frp 版本 ====="
            grep -n 'FRP_VER :=' trunk/user/frp/Makefile
            grep -q 'FRP_VER := 0.71.1' trunk/user/frp/Makefile || fail "FRP_VER 不是 0.71.1"
            echo "===== verify: ttyd 版本（0009，第 163 轮）====="
            grep -n 'SRC_NAME=ttyd' trunk/user/ttyd/Makefile
            grep -q 'SRC_NAME=ttyd-1.7.7' trunk/user/ttyd/Makefile || fail "ttyd 不是 1.7.7（0009 未生效）"
            grep -q '\-W ' trunk/user/ttyd/ttyd.sh || fail "ttyd.sh 缺 -W（1.7.4+ 默认只读，不加 -W 登录无法输入）"
            echo "===== verify: M9 修复（0010）====="
            grep -q 'UINT16 PktLen' trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt7615/embedded/common/igmp_snoop.c || fail "0010 未生效：igmp_snoop.c 无 PktLen"
            grep -q 'clamp group-record walk' trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt7615/embedded/common/igmp_snoop.c || fail "0010 未生效：缺循环钳位"
            grep -q 'bound ext-header chain walk' trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt7615/embedded/common/igmp_snoop.c || fail "0010 未生效：缺 MLD 扩展头钳位"
            grep -q 'isMldPkt(pDstMacAddr, pIpHeader, &MldType, &pMldHeader, PktLen)' trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt7615/embedded/common/igmp_snoop.c || fail "0010 未生效：isMldPkt 未传长度"
            grep -q 'IgmpPktLen' trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt7615/embedded/ap/ap_data.c || fail "0010 未生效：ap_data.c 调用点未传长度"
            echo "===== verify: libs 批次升级（0011~0014）====="
            grep -q 'SRC_NAME=zlib-1.2.13' trunk/libs/libz/Makefile || fail "0011 未生效：zlib 不是 1.2.13"
            grep -q 'SRC_NAME=libpcap-1.10.7' trunk/libs/libpcap/Makefile || fail "0012 未生效：libpcap 不是 1.10.7"
            grep -q 'SRC_NAME=libuv-v1.53.0' trunk/libs/libuv/Makefile || fail "0013 未生效：libuv 不是 1.53.0"
            grep -q 'SRC_NAME=json-c-json-c-0.18' trunk/libs/libjson-c/Makefile || fail "0014 未生效：json-c 不是 0.18"
            echo "===== verify: OpenSSL 1.1.1w（0015）====="
            grep -q 'SRC_NAME=openssl-1.1.1w' trunk/libs/libssl/Makefile || fail "0015 未生效：openssl 不是 1.1.1w"
            test -f trunk/libs/libssl/openssl-1.1.1w.patch || fail "0015 未生效：w 版补丁文件缺失"
            grep -q 'OPENSSL_PREFER_CHACHA_OVER_GCM' trunk/libs/libssl/openssl-1.1.1w.patch || fail "0015 补丁内容异常：缺 CHACHA 选项"
            echo "===== verify: curl 7.88.1（0016）====="
            grep -q 'SRC_NAME=curl-7.88.1' trunk/libs/libcurl/Makefile || fail "0016 未生效：curl 不是 7.88.1"
            # 第 187 轮 A11：包必须是 release dist 版（含 lib/Makefile.in），否则 codeload 版会静默少文件
            grep -q 'lib/Makefile.in' trunk/libs/libcurl/Makefile || fail "0016 未生效：缺 release 包校验（lib/Makefile.in 守卫）"
            test -f trunk/libs/libcurl/no_docs_test-7.88.1.patch || fail "0016 未生效：7.88.1 补丁文件缺失"
            echo "===== verify: ncurses 6.5（0017）====="
            grep -q 'SRC_NAME=ncurses-6.5' trunk/libs/libncurses/Makefile || fail "0017 未生效：ncurses 不是 6.5"
            test -f trunk/libs/libncurses/ncurses-6.5.patch || fail "0017 未生效：6.5 补丁文件缺失"
            grep -q 'tar -xzf' trunk/libs/libncurses/Makefile || fail "0017 未生效：extract 未改为 tar"
            echo "===== verify: lan_proto_x 默认值（0018）====="
            grep -q '"lan_proto_x", "0"' trunk/user/shared/defaults.c || fail "0018 未生效：lan_proto_x 默认值仍为 1"
            echo "===== verify: 管理帧最小长度（0019 · 第 190 轮扩为全族）====="
            MLME=trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt7615/embedded/common/mlme.c
            grep -q 'drop short mgmt frame' "$MLME" || fail "0019 未生效：缺管理帧长度守卫"
            # A3：守卫必须在【所有】MsgTypeSubst 分派之前，且早于 bToApCli 分支
            #     （第 183 轮 R-183-1：原守卫写在 bToApCli 块内 ⇒ 纯 AP 路径裸奔）
            G=$(grep -n 'drop short mgmt frame' "$MLME" | head -1 | cut -d: -f1)
            A=$(grep -n 'ApCliMsgTypeSubst(pAd, pFrame' "$MLME" | head -1 | cut -d: -f1)
            B=$(grep -n 'if ((ApBssIdx_find == FALSE) &&' "$MLME" | head -1 | cut -d: -f1)
            P=$(grep -n 'if (APMsgTypeSubst(pAd, pFrame' "$MLME" | head -1 | cut -d: -f1)
            if [ -n "$G" ] && [ -n "$A" ] && [ -n "$B" ] && [ -n "$P" ] && [ "$G" -lt "$B" ] && [ "$G" -lt "$A" ] && [ "$G" -lt "$P" ]; then
              echo "  OK   0019 守卫在 AP/APCLI 分派之前（guard=$G < bToApCli=$B < apcli=$A / ap=$P）"
            else
              fail "0019 守卫位置不对：guard=$G bToApCli=$B apcli=$A ap=$P（守卫必须在全部之前）"
            fi
            for T in SUBTYPE_ASSOC_REQ SUBTYPE_REASSOC_REQ SUBTYPE_DISASSOC SUBTYPE_DEAUTH SUBTYPE_ACTION min_len ; do
              grep -q "$T" "$MLME" || fail "0019 未生效：管理帧全族表缺 $T"
            done
            grep -q 'case SUBTYPE_ACTION_NO_ACK:' "$MLME" || fail "0019 未生效：全族表缺 ACTION_NO_ACK(14)"
            echo "  OK   0019 管理帧全族最小长度表齐备（含 ACTION_NO_ACK）"
            echo "===== verify: sys_script 白名单（0030 F20-1）====="
            grep -q 'strspn(name, "abcdefghijklmnopqrstuvwxyz' trunk/user/httpd/web_ex.c || fail "0030 未生效：缺脚本名白名单"
            echo "===== verify: ej_dump 路径穿越（0031 F44-1）====="
            grep -q "strchr(file, '/')" trunk/user/httpd/web_ex.c || fail "0031 未生效：缺文件名校验"
            echo "===== verify: httpd 认证门（0032 r3 · need_auth 一律认证；仅放行 watchdog 探测 GET）====="
            # ★ 2026-10-27 第 198 轮：r3 保留 localhost 的**只读探测**豁免，只放行
            #   `GET httpd_check.htm`。rc/watchdog.c:116 无凭据 wget 该 URL 并 grep
            #   "ASUSTeK"；旧 0032 把探测一并拒掉，watchdog.c:389 会每 90 s kill -9 httpd。
            #   负向断言只看代码行写法（`handler->need_auth && login_state ...`），
            #   注释里引用旧条件 `login_state > 1` 不再误判。
            grep -q 'handler->need_auth && !do_logout' trunk/user/httpd/httpd.c || fail "0032 未生效：认证门未改为 need_auth && !do_logout"
            grep -q 'strcmp(file, "httpd_check.htm") == 0' trunk/user/httpd/httpd.c || fail "0032r3 未生效：缺 watchdog 探测豁免"
            if grep -qE 'handler->need_auth && login_state (>|!=) 1' trunk/user/httpd/httpd.c; then
              fail "0032 未生效：旧门控（handler->need_auth && login_state > 1）仍残留"
            else
              echo "  OK   0032r3 门控 = need_auth && !do_logout，仅 httpd_check.htm 的 GET 豁免"
            fi
            echo "===== verify: libwebsockets 4.5.8（0020）====="
            grep -q 'SRC_NAME=libwebsockets-4.5.8' trunk/libs/libwebsockets/Makefile || fail "0020 未生效：lws 不是 4.5.8"
            test -f trunk/libs/libwebsockets/libwebsockets-4.5.8.patch || fail "0020 未生效：4.5.8 补丁文件缺失"
            echo "===== verify: raeth RX 长度守卫（0021）====="
            grep -q 'R177 fix: PLEN0 is a 14-bit field' trunk/linux-4.4.x/drivers/net/ethernet/raeth/raether.c || fail "0021 未生效：raether.c 缺 PLEN0 长度守卫"
            grep -q 'rx_recycle_desc' trunk/linux-4.4.x/drivers/net/ethernet/raeth/raether.c || fail "0021 未生效：缺描述符回收标签"
            echo "===== verify: vlmcsd RPC bind 整数溢出（0022）====="
            grep -q 'vlmcsd-rpcbind-overflow.patch' trunk/user/vlmcsd/Makefile || fail "0022 未生效：Makefile 未挂载解压后补丁"
            test -f trunk/user/vlmcsd/vlmcsd-rpcbind-overflow.patch || fail "0022 未生效：内层补丁文件缺失"
            grep -q 'R178 fix' trunk/user/vlmcsd/vlmcsd-rpcbind-overflow.patch || fail "0022 内层补丁内容异常"
            echo "===== verify: 保留项仍在（coremark / inadyn / miniupnpd / wpa_supplicant）====="
            for d in coremark inadyn miniupnpd wpa_supplicant ; do
              grep -qE "dir_[a-z]*.*$d" trunk/user/Makefile || fail "保留项缺失: $d"
            done
            echo "===== verify: Web 入口裁剪（0007 / 0008）====="
            # ★★ 2026-10-16 第 110 轮·前置修正（原断言有两处缺陷，都会造成【假通过】）：
            #   ① 路径错：`internet.asp` 的真路径是 `n56u_ribbon_fixed/device-map/internet.asp`
            #      （不在 www 根下）。依据：上游 contents API @ff77acc（www 根 404 / device-map 200，
            #      12,102 B，md5 f6657e7b5b1ca15a36bef567cfef839a）+ 产物实测 `www\device-map\internet.asp`。
            #   ② 写法错：原为 `grep -q X F && fail … || echo OK`。当 **F 不存在** 时 grep 返回 **2**（≠0）
            #      ⇒ 跳过 fail ⇒ 落到 `|| echo OK` ⇒ **打印 "OK" 而实际什么都没验证**。
            #   ⇒ 改为 **fail-closed**：先断言"文件存在"，再做内容断言（文件缺失 = fail，不再静默通过）。
            ASP_SVC=trunk/user/www/n56u_ribbon_fixed/Advanced_Services_Content.asp
            ASP_INT=trunk/user/www/n56u_ribbon_fixed/device-map/internet.asp
            if [ ! -f "$ASP_SVC" ]; then
              fail "找不到 $ASP_SVC（路径错或上游布局变更）"
            elif grep -q 'adsc_enable' "$ASP_SVC"; then
              fail "infosvr 开关未删除（patches/0007 未生效）"
            else
              echo "  OK   infosvr 开关已从 Advanced_Services_Content.asp 删除"
            fi
            if [ ! -f "$ASP_INT" ]; then
              fail "找不到 $ASP_INT（路径错或上游布局变更）"
            elif grep -q 'vpnsrv\.asp' "$ASP_INT"; then
              fail "VPN 菜单项未删除（patches/0008 未生效）"
            else
              echo "  OK   VPN 下拉项已从 device-map/internet.asp 删除"
            fi
            if grep -q 'www/vpnsrv\.asp' trunk/user/www/Makefile; then
              echo "  OK   www/Makefile 已含 VPN 页删除行"
            else
              fail "www/Makefile 缺 VPN 页删除行（patches/0008 未生效）"
            fi
          fi
          [ "$FAILED" = "0" ] || { echo "::error::补丁断言未全部通过（见上文 ::error:: 行）"; exit 1; }

      # ---- ★★ 供应链加固：预取 + 校验 frp tarball（第 110 轮·前置新增；用户 2026-10-16 决定「一起并入本轮」）----
      #   背景：`trunk/user/frp/Makefile` 用 `wget --no-check-certificate` 抓 12.5 MB tarball 且【不校验任何哈希】
      #         —— 这是整条构建链里【唯一从未被本地验证过】的联网环节（第 108 轮 FRPC=n ⇒ 该分支一次都没跑过）。
      #   做法：先按上游同一 URL 预取到 make 期望的落点并校验 sha256；make 见文件已存在即跳过下载。
      #   上游原文依据（全文转录：03_原始证据/r109g_upstream_frp_Makefile_ff77acc.txt）：
      #     第  6 行  THISDIR := $(shell pwd)                          ⇒ 落点 = trunk/user/frp/
      #     第 10 行  FRP_NAME := frp_$(FRP_VER)_linux_mipsle
      #     第 11 行  FRP_URL := $(FRP_URL_BASE)/v$(FRP_VER)/$(FRP_NAME).tar.gz
      #     第 17 行  if [ ! -f $(FRP_NAME).tar.gz ]; then … fi        ⇒ 「已存在则跳过下载」成立（本步前提）
      #   ⚠️ 本步【不调 fail()】：sha 不符直接 exit 1（不受 strict_assert 降级影响）——
      #      供应链校验一旦能被"放宽"，就等于没有（同 FRPC/FRPS 硬断言的理由）。
      - name: Prefetch & verify frp tarball (sha256 pin)
        run: |
          set -e
          EXPECT_SHA=2eaa97e6b42a0cbd672b079b59d5682bb64a766f9a9564d7c4bbbd3ca79ec694
          FRP_VER=$(grep -m1 '^FRP_VER :=' trunk/user/frp/Makefile | awk '{print $NF}')
          echo "补丁后 FRP_VER = ${FRP_VER}（来源 patches/0005）"
          NAME=frp_${FRP_VER}_linux_mipsle
          URL="https://github.com/fatedier/frp/releases/download/v${FRP_VER}/${NAME}.tar.gz"
          cd trunk/user/frp
          echo "落点 : $(pwd)/${NAME}.tar.gz"
          echo "URL  : ${URL}"
          if [ -f "${NAME}.tar.gz" ]; then
            echo "已存在 ⇒ 上游 make 将跳过下载（Makefile 第 17 行判据）"
          else
            wget -t3 --timeout=30 -O "${NAME}.tar.gz" "${URL}"
          fi
          echo "实测 sha256 = $(sha256sum "${NAME}.tar.gz" | awk '{print $1}')"
          if ! echo "${EXPECT_SHA}  ${NAME}.tar.gz" | sha256sum -c - ; then
            echo "::error::frp tarball sha256 不符 —— 上游资产可能已变，或 FRP_VER 与本 pin 不同步"
            echo "::error::本 pin 对应 v0.71.1（12,563,764 B；内层 frpc md5 da7d524a0bd92a953905e59ce032c9ba）"
            echo "::error::若确要升级：先 sha256sum 实测新包，再同步更新本步 EXPECT_SHA 与 patches/0005 的 FRP_VER"
            exit 1
          fi
          echo "  OK   frp tarball sha256 与 pin 一致（供应链校验通过）"
          ls -l "${NAME}.tar.gz"

      # ---- 8 个库的 sha256 钉死（★ 2026-10-25 第 187 轮新增 · B3）----
      #   背景：上游各 lib 的 Makefile 都是 `wget --no-check-certificate`，**零校验**（R-12）。
      #   做法：在构建前把包预取到各 lib 目录（上游判据是「文件已存在则跳过下载」），
      #         在这里做唯一一次 sha256 校验；不符即 ::error:: 退出。
      #   ★ 全部 hash 于 2026-10-25 经联网实测（代理 10808）；见报告第187轮 §13。
      #   ⚠️ openssl 的行是 **release asset**（官方 dist 包，9,893,384 B）；
      #      旧台账记的 10,070,335 B/2130e8c2 是 **github archive** 包，与 0015 的 SRC_URL 不符，已更正。
      - name: Prefetch & verify 8 library tarballs (sha256 pin)
        run: |
          set -e
          fetch() {  # $1=libs 子目录  $2=文件名  $3=URL  $4=sha256
            mkdir -p "trunk/libs/$1"
            cd "trunk/libs/$1"
            if [ ! -f "$2" ]; then
              echo "-- 下载 $1/$2"
              wget -t3 --timeout=60 -O "$2.part" "$3"
              mv "$2.part" "$2"
            fi
            if ! echo "$4  $2" | sha256sum -c - ; then
              echo "::error::trunk/libs/$1/$2 sha256 不符（期望 $4）"
              echo "::error::上游资产可能已变。若确要换版本：同步改 patches/ 里的 SRC_URL 与本步 pin。"
              exit 1
            fi
            echo "  OK   $1/$2"
            cd "$GITHUB_WORKSPACE"
          }
          fetch libz          zlib-1.2.13.tar.gz                 https://zlib.net/fossils/zlib-1.2.13.tar.gz b3a24de97a8fdbc835b9833169501030b8977031bcb54b3b3ac13740f846ab30
          fetch libpcap       libpcap-1.10.7.tar.gz              https://www.tcpdump.org/release/libpcap-1.10.7.tar.gz 0b394ac90dbc0a9838ff97468e05c9c9a3e873dec2514cd58db65d859d296e31
          fetch libuv         libuv-v1.53.0.tar.gz               https://dist.libuv.org/dist/v1.53.0/libuv-v1.53.0.tar.gz cb0d6dd2128d5a95bd242c6cc982a24fe608fa93da57b6b4ec763b0018c53e64
          fetch libjson-c     json-c-json-c-0.18-20240915.tar.gz https://github.com/json-c/json-c/archive/json-c-0.18-20240915.tar.gz 3112c1f25d39eca661fe3fc663431e130cc6e2f900c081738317fba49d29e298
          fetch libssl        openssl-1.1.1w.tar.gz               https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8
          fetch libcurl       curl-7.88.1.tar.xz                 https://github.com/curl/curl/releases/download/curl-7_88_1/curl-7.88.1.tar.xz 1dae31b2a7c1fe269de99c0c31bb488346aab3459b5ffca909d6938249ae415f
          fetch libncurses    ncurses-6.5.tar.gz                 https://ftpmirror.gnu.org/ncurses/ncurses-6.5.tar.gz 136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6
          fetch libwebsockets libwebsockets-4.5.8.tar.gz         https://github.com/warmcat/libwebsockets/archive/v4.5.8.tar.gz b6ade658f4af3a823d0dc806ae5ef0623f0f4f5e2aeb895a0f77c4783840c30e
          echo "===== 8 个库全部通过 sha256 校验 ====="

      # ---- 余量预检：本轮的体积假设（★ 2026-10-16 按 v1/v2/v3 复核修正数字）----
      - name: Headroom sanity (v109 expectation)
        run: |
          echo "mtd3 firmware 上限        = 15,925,248 B (0xF30000 · /proc/mtd 实测 · 三重算术自洽)"
          echo "上一版镜像 (ae2a126)      =  9,322,565 B (md5 85f4287f...)"
          echo "本轮 +frpc                =  4,524,160 B  ← 真二进制实测（128K 分块 xz preset6，参数取自 squashfs-tools/xz_wrapper.c）；strip 后只会更小 ⇒ 此值为上限"
          echo "本轮 +lrzsz(lrz+lsz)      ≈   +60 KB 上下  ← 新增组件（LRZSZ n→y），量级极小，未单独实测（估算口径，见 doc/D12 §F.17 附注）"
          echo "本轮 -裁剪(9 组件)        =    471,646 B  ← 按各组件 romfs 归属实测"
          echo "=> 预计镜像 ≈ 13.43 MB ⇒ 余量 ≈ 2.49 MB (≈15.6%)；最坏（删除集合落空）13.90 MB ⇒ 余 ≈13.0% 仍装得下"
          echo "⚠️ 真正的尺寸/CRC 闸门 = 下一步 'Verify built image'（超限即 ::error:: 退出）"
          echo "   —— CI 里不会出现 'image too big' 字样（那是网页刷机侧的话术）"
          echo "⚠️ 若要回退改 config：dispatch 必须同时设 strict_assert=no，否则会被本 workflow 断言拦下"

      # ---- toolchain：预编译 tar.xz，命中缓存则秒过 ----
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: toolchain-mipsel/toolchain-4.4.x
          key: tc-4.4.x-${{ runner.os }}-v1

      # ---- toolchain：预编译 tar.xz，命中缓存则秒过 ----
      #   ★ R-13 fix（第 182 轮）：release 无官方 digest，且 dl_toolchain.sh 的 curl 不校验
      #     ⇒ 「换 tag 静默换 libc」这条 P1 风险在流水线上原本零拦截点。
      #     现把第 180 轮实测的 md5/sha256 钉在这里；不符即 ::error:: 退出。
      #     若将来有意升级工具链：改下面两个常量 + 同步 doc/D14 K01 与 00_交接文档。
      - name: Prepare toolchain
        env:
          TC_MD5: d0d96e64acf0ff115dca6ef678ce3f99
          TC_SHA256: 928db92fb2dd2d9f7cc540a40cbadaa2224b582e7b186f46c743d458ad768dc6
        run: |
          set -e
          cd toolchain-mipsel
          sh dl_toolchain.sh          # 已存在 toolchain-4.4.x/ 时脚本会直接跳过
          # 无论走了下载分支还是「已存在」分支，都校验一次内容
          ARCH="$(uname -m)"
          case "$ARCH" in
            aarch64) F=aarch64_mipsel-linux-uclibc.tar.xz ;;
            x86_64)  F=mipsel-linux-uclibc.tar.xz ;;
            *) echo "::error::unknown ARCH=$ARCH"; exit 1 ;;
          esac
          if [ ! -f "$F" ]; then
            echo "::error::$F 不存在（dl_toolchain.sh 未下载？）"; exit 1
          fi
          echo "  size = $(wc -c < "$F") bytes"
          GOT_MD5=$(md5sum "$F" | awk '{print $1}')
          GOT_SHA=$(sha256sum "$F" | awk '{print $1}')
          if [ "$GOT_MD5" != "$TC_MD5" ] || [ "$GOT_SHA" != "$TC_SHA256" ]; then
            echo "::error::toolchain 校验不符 —— 实测 md5=$GOT_MD5 sha256=$GOT_SHA"
            echo "::error::期望 md5=$TC_MD5 sha256=$TC_SHA256"
            echo "::error::⇒ 上游换了 tag/内容。若是【有意】升级：改本步两个常量 + 同步 doc/D14 K01；否则说明供应链被污染，立即停止。"
            exit 1
          fi
          echo "  OK   toolchain md5/sha256 与钉死值一致（$GOT_MD5）"

      - name: Build firmware
        run: |
          cd trunk
          mkdir -p ${IMAGES_DIR}
          fakeroot ./build_firmware_ci ${TARGET}
          cp -f images/*.trx ${IMAGES_DIR}/
          ls -lh ${IMAGES_DIR}/

      # ---- ★ 2026-10-16 新增：「裁剪真的生效了吗」在编译阶段闭环（不必等刷机）----
      #   依据：复核报告 v2 §7-G。trunk/tools/Makefile 的 all: 会构建 mksquashfs_xz（内含 unsquashfs），
      #   且 vendors/Ralink/Makefile 的 romfs.post:: 把 squashfs 写成 images/ramdisk ⇒ 零额外安装即可查。
      #   （等价做法：本地用 04 工具脚本解 .trx；本步在 CI 内做，失败即 ::error::）
      - name: Verify trim & new components in rootfs
        run: |
          set -e
          FAILED=0
          # ★ 累积式断言：一次列全所有不符项（不 fail-fast），末尾统一退出
          fail() { if [ "$STRICT_ASSERT" = "no" ]; then echo "::warning::$*"; else echo "::error::$*"; FAILED=1; fi; }
          # ① 0003 是否真生效（编译中间产物，未压缩，最可靠）
          for m in CHECK_PORTINUSE ENABLE_LEASEFILE ; do
            grep -q "^#define $m\$" trunk/user/miniupnpd/miniupnpd-2.x/config.h \
              && echo "  OK   miniupnpd config.h: #define $m" \
              || fail "0003 未生效：miniupnpd-2.x/config.h 缺 #define $m"
          done
          # ② 版本串是否真嵌入（FWREVSTR 只有 7 位 hash；★ 路径是 /sbin/rc，不是 /usr/sbin/rc）
          H=$(git rev-parse --short=7 HEAD)
          if [ -z "$H" ]; then fail "git rev-parse 为空 ⇒ versions.inc 的 \$(shell git ...) 静默失败"; fi
          strings trunk/romfs/sbin/rc | grep -q "$H" \
            && echo "  OK   romfs/sbin/rc 内嵌本次提交 hash: $H" \
            || fail "romfs/sbin/rc 未嵌入 $H（FWREVSTR 注入失败？）"
          # ③ 产物内容断言
          U=trunk/tools/mksquashfs_xz/unsquashfs ; R=trunk/images/ramdisk
          if [ ! -x "$U" ] || [ ! -f "$R" ]; then
            fail "找不到 $U 或 $R（构建树布局变了）⇒ 本步降级；请本地解 .trx 复核内容"
          else
            "$U" -ll "$R" > /tmp/rootfs-list.txt 2>/dev/null || fail "unsquashfs 解析失败: $R"
            echo "  rootfs 条目数: $(wc -l < /tmp/rootfs-list.txt)"
            echo "===== 必须【存在】 ====="
            # ★ 2026-10-16 修正（第 109 轮首次实跑 run 38865414649 第 13 步发现）：openssl 与 tcpdump 的目录此前【写反了】。
            #   上游源码依据：trunk/libs/libssl/Makefile:81   → $(ROMFSINST) $(SRC_NAME)/apps/openssl /usr/bin/openssl
            #                 trunk/user/tcpdump/Makefile romfs: → $(ROMFSINST) /usr/sbin/tcpdump
            #   产物实测依据：第 108 轮产物 rootfs 解包 = usr/bin/openssl (572,044 B) + usr/sbin/tcpdump (334,832 B)
            #   ⇒ 断言强度【不变】：两个二进制仍必须存在，只是把目录改对（不是放宽判据）。
            for f in usr/bin/frpc usr/bin/lsz usr/bin/lrz usr/bin/nano usr/bin/htop usr/bin/openssl usr/bin/ttyd usr/sbin/tcpdump usr/bin/iperf3 usr/bin/smartdns bin/tc ; do
              grep -qE "(^|/)${f}\$" /tmp/rootfs-list.txt && echo "  OK   $f" || fail "缺少 $f"
            done
            echo "===== ★★ 硬需求（【不受 strict_assert 降级影响】）：frpc 必须在产物里 ====="
            # 依据同上：用户明确「新固件必须包含 frpc」。此处直接 exit 1，不走 fail() 降级。
            grep -qE "(^|/)usr/bin/frpc\$" /tmp/rootfs-list.txt \
              && echo "  OK   usr/bin/frpc（硬需求，产物已含）" \
              || { echo "::error::产物 rootfs 缺少 usr/bin/frpc —— 用户要求「新固件必须包含 frpc」"; exit 1; }
            # 版本闸门：证明 patches/0005（FRP_VER 0.29.0 → 0.71.1）真的应用了
            #   ★ 0.71.1 是官方 mipsle 包确认存在的版本；且该二进制已在 AP1 上实测可运行（03_原始证据/r109e）
            grep -q "^FRP_VER := 0.71.1\$" trunk/user/frp/Makefile \
              && echo "  OK   FRP_VER := 0.71.1（0005 已生效）" \
              || fail "FRP_VER 不是 0.71.1（patches/0005 未生效？）：$(grep -m1 '^FRP_VER' trunk/user/frp/Makefile || echo '(missing)')"
            echo "===== 必须【不存在】（本轮裁剪项）====="
            # ⚠️ bin/rt2860apd 是 802.1x 包产物（AP 侧 WPA-Enterprise/RADIUS 认证器）；
            #    本机 auth_mode=psk ⇒ 从不启动 ⇒ 随包删除。若将来要 WPA-Enterprise，必须恢复该包。
            for f in usr/sbin/infosvr usr/sbin/lanauth usr/sbin/udpxy usr/sbin/xl2tpd usr/sbin/pptpd usr/sbin/pptpctrl usr/sbin/bcrelay usr/sbin/openvpn usr/bin/openvpn-cert.sh usr/bin/xupnpd bin/rt2860apd ; do
              if grep -qE "(^|/)${f}\$" /tmp/rootfs-list.txt ; then fail "仍存在（裁剪未生效）: $f"; else echo "  OK   已移除 $f"; fi
            done
            echo "===== 必须【不存在】（Web 入口 · 0007 / 0008）====="
            for f in www/vpnsrv.asp www/vpncli.asp www/vpn_clients.asp ; do
              if grep -qE "(^|/)${f}\$" /tmp/rootfs-list.txt ; then fail "仍存在（UI 裁剪未生效）: $f"; else echo "  OK   已移除 $f"; fi
            done
            # 内容级：产物页里 infosvr 开关应已消失（unsquashfs -cat 不可用则如实跳过，绝不做假通过）
            if "$U" -cat "$R" www/Advanced_Services_Content.asp > /tmp/adv_asp.txt 2>/dev/null && [ -s /tmp/adv_asp.txt ] ; then
              if grep -q 'adsc_enable' /tmp/adv_asp.txt ; then
                fail "产物 www/Advanced_Services_Content.asp 仍含 adsc_enable（0007 未生效）"
              else
                echo "  OK   产物页已无 infosvr 开关（adsc_enable 0 命中）"
              fi
            else
              echo "  (unsquashfs -cat 不可用 ⇒ 内容级检查跳过；步骤 8 已在源码层验证)"
            fi
            # ★★ 2026-10-16 新增（第 110 轮·前置）：VPN 下拉项的【产物级】内容断言。
            #   路径必须是 device-map/internet.asp（详见步骤 8 的路径修正说明）；
            #   同样 fail-closed：拿不到文件 ⇒ 不算通过，也不算失败，但打印明确提示以便区分"跳过"与"已验"。
            if "$U" -cat "$R" www/device-map/internet.asp > /tmp/int_asp.txt 2>/dev/null && [ -s /tmp/int_asp.txt ] ; then
              if grep -q 'vpnsrv\.asp\|vpncli\.asp' /tmp/int_asp.txt ; then
                fail "产物 www/device-map/internet.asp 仍含 VPN 菜单项（0008 未生效）"
              else
                echo "  OK   产物页已无 VPN 下拉项（device-map/internet.asp · vpnsrv/vpncli 0 命中）"
              fi
            else
              echo "  (unsquashfs -cat 不可用 ⇒ device-map/internet.asp 内容级检查跳过；步骤 8 已在源码层验证)"
            fi
          fi
          [ "$FAILED" = "0" ] || { echo "::error::产物内容断言未全部通过（见上文 ::error:: 行）"; exit 1; }

      # ---- 产物自检（u-boot legacy image 头 + 双 CRC + squashfs 魔数 + 加载地址 + 尺寸）----
      # ★ 2026-10-15 修正：原实现按【Broadcom trx 头】布局解析（b[4:8]=len, b[8:12]=crc），
      #   而 Padavan 产出的 .trx 实为【u-boot legacy image】⇒ 必然误报 "data crc BAD / TOO BIG"。
      #   正确布局：0x04 hcrc · 0x08 itime · 0x0C ih_size · 0x10 ih_load · 0x14 ih_ep · 0x18 dcrc。
      #   本次判据与本地 04_工具脚本/r102_trx_verify.py 对齐（该脚本已对真实镜像实测通过）。
      - name: Verify built image
        run: |
          cd ${IMAGES_DIR}
          python3 - <<'PY'
          import glob, struct, zlib
          MAGIC    = 0x27051956      # u-boot legacy image
          MTD3_LEN = 15925248        # 设备 /proc/mtd 实测
          LOAD     = 0x81001000      # 上游 Makefile LOAD_ADDR
          trx = sorted(glob.glob("*.trx"))
          if not trx:
              raise SystemExit("::error::no .trx produced")
          bad = []
          for p in trx:
              b = open(p, "rb").read()
              magic = struct.unpack(">I", b[0:4])[0]
              hcrc, itime, isize, iload, iep, dcrc = struct.unpack(">IIIIII", b[4:28])
              hdr = bytearray(b[0:64]); hdr[4:8] = b"\0\0\0\0"
              hcrc_calc = zlib.crc32(bytes(hdr)) & 0xffffffff
              dcrc_calc = zlib.crc32(b[64:64 + isize]) & 0xffffffff
              total = 64 + isize
              ksz = struct.unpack(">I", b[60:64])[0]
              sq_ok = b[ksz:ksz + 4] == b"hsqs"
              print("image: %s  %d bytes" % (p, len(b)))
              print("  magic    : 0x%08X %s" % (magic, "OK" if magic == MAGIC else "BAD (not u-boot legacy image)"))
              print("  ih_size  : %d  ->  image total %d (64 + ih_size)" % (isize, total))
              print("  ih_load  : 0x%08X %s" % (iload, "OK" if iload == LOAD else "BAD (expect 0x%08X)" % LOAD))
              print("  hdr crc  : 0x%08X / calc 0x%08X  %s" % (hcrc, hcrc_calc, "OK" if hcrc == hcrc_calc else "BAD"))
              print("  data crc : 0x%08X / calc 0x%08X  %s" % (dcrc, dcrc_calc, "OK" if dcrc == dcrc_calc else "BAD"))
              print("  rootfs   : hsqs @0x%X  %s" % (ksz, "OK" if sq_ok else "BAD"))
              print("  fits mtd3(%d): %s  margin %d" % (MTD3_LEN, "OK" if total <= MTD3_LEN else "TOO BIG", MTD3_LEN - total))
              if not (magic == MAGIC and hcrc == hcrc_calc and dcrc == dcrc_calc
                      and sq_ok and iload == LOAD and total <= MTD3_LEN):
                  bad.append(p)
          if bad:
              raise SystemExit("::error::image self-check FAILED: %s" % ", ".join(bad))
          print("::notice::all images passed: magic + hdr crc + data crc + squashfs + load + size")
          PY

      - name: Package (md5 + 7z)
        run: |
          cd ${IMAGES_DIR}
          md5sum *.trx | tee md5sum.txt
          7z a -mx=9 k2p-padavan-images.7z ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: K2P-padavan-images
          path: ${{ env.IMAGES_DIR }}/*.7z
          retention-days: 30
